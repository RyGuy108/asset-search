services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: assets }
    command: postgres -c shared_buffers=1GB -c work_mem=64MB
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    environment: &env
      DATABASE_URL: postgresql://postgres:postgres@db:5432/assets
      REDIS_URL: redis://redis:6379/0
      MAGIC_HOUR_API_KEY: ${MAGIC_HOUR_API_KEY:-}
      MEDIA_DIR: /media
    volumes: [media:/media]
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: .
    command: rq worker variants --url redis://redis:6379/0
    environment: *env
    volumes: [media:/media]
    depends_on: [db, redis]
  web:
    build: ./web
    environment: { NEXT_PUBLIC_API: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { pgdata: {}, media: {} }
